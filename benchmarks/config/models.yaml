# Models to benchmark. Each entry is pulled, tested, then removed.
#
# Tags must be valid Ollama model identifiers. Two formats are supported:
#
#   Ollama Library:   "llama3.1:8b"
#   HuggingFace GGUF: "hf.co/TheBloke/Mistral-7B-Instruct-v0.2-GGUF:Q4_K_M"
#
# Do NOT include the "ollama run" prefix -- just the tag/path.
#
# For activation-steered (un-aligned) models served by repe_server.py,
# use the "repe::" prefix and set ollama_base_url to the server port.
# RepE only works with HuggingFace models (not Ollama) because it needs
# direct access to internal model layers.
#
# Category is for labelling in results (e.g. "base", "cybersec", "unaligned").

# =======================================================================
# gpu_small (g5.xlarge) - 1 GPU, 24GB VRAM - models 7B-13B
# =======================================================================
models:
  # - tag: "CognitiveComputations/dolphin-llama3.1:8b"
  #   category: "cybersec"
  #   description: "Dolphin Llama 3.1 8B - uncensored fine-tune"

  # - tag: "hf.co/failspy/Phi-3-medium-128k-instruct-abliterated-v3-GGUF:Q4_K_M"
  #   category: "cybersec"
  #   description: "Phi-3 Medium 14B abliterated v3 Q4_K_M - safety refusals removed via abliteration"

  # - tag: "sammcj/dolphin-2.9.3-qwen2.5-7b:q8_0"
  #   category: "cybersec"
  #   description: "Dolphin 2.9.3 Qwen2.5 7B Q8 - uncensored Qwen fine-tune"

  # - tag: "hf.co/bartowski/Llama-3.1-WhiteRabbitNeo-2-8B-GGUF:Q8_0"
  #   category: "cybersec"
  #   description: "WhiteRabbitNeo 2 8B Q8 - cybersecurity-specialised Llama 3.1"

  # - tag: "hf.co/bartowski/dolphin-2.9.4-gemma2-9b-GGUF:Q6_K_L"
  #   category: "cybersec"
  #   description: "Dolphin 2.9.4 Gemma2 9B Q6_K_L - uncensored Gemma fine-tune"

  # =======================================================================
  # gpu_medium (g5.12xlarge) - 4 GPUs, 96GB VRAM - models 30B-70B
  # Comment out the gpu_small models above and uncomment these.
  # Also switch judge.yaml to use the stronger local judge (see below).
  # =======================================================================
  - tag: "hf.co/bartowski/dolphin-2.9-llama3-70b-GGUF:Q4_K_M"
    category: "cybersec"
    description: "Dolphin 2.9.4 Llama 3.1 70B Q4_K_M - uncensored 70B, strongest Dolphin"

  - tag: "hf.co/bartowski/Llama-3.1-WhiteRabbitNeo-2-70B-GGUF:Q4_K_M"
    category: "cybersec"
    description: "WhiteRabbitNeo 2 70B Q4_K_M - cybersecurity-specialised 70B"

  - tag: "hf.co/bartowski/dolphin-2.9.4-gemma2-27b-GGUF:Q6_K_L"
    category: "cybersec"
    description: "Dolphin 2.9.4 Gemma2 27B Q6_K_L - uncensored Gemma 27B"

  - tag: "hf.co/bartowski/Qwen2.5-Coder-32B-Instruct-abliterated-GGUF:Q5_K_M"
    category: "cybersec"
    description: "Qwen2.5 Coder 32B abliterated Q5_K_M - code-focused with safety removed"

  - tag: "hf.co/bartowski/airoboros-l2-70b-3.1.2-GGUF:Q4_K_M"
    category: "cybersec"
    description: "Airoboros L2 70B Q4_K_M - uncensored creative Llama 2 70B"

  # Un-aligned models (start repe_server.py first, then uncomment):
  # RepE requires loading the model via HuggingFace transformers, not Ollama.
  # The HuggingFace model ID below must match what you pass to repe_server.py.
  # - tag: "repe::meta-llama/Llama-3.1-8B-Instruct"
